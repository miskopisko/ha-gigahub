# A "Network" dashboard view for the Bell Giga Hub integration.
# Needs mini-graph-card (live graphs) and flex-table-card (sortable Wi-Fi devices table)
# from the Marketplace; everything else is built in.
# Add it with: Dashboard > ⋮ > Edit > ⋮ > Raw configuration editor, and paste this under `views:`.
title: Network
path: network
icon: mdi:router-network
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: Internet
        heading_style: title
        icon: mdi:web
      - type: tile
        entity: binary_sensor.giga_hub_internet
        name: Internet
      - type: tile
        entity: sensor.giga_hub_connected_since
        name: Connected since
      - type: tile
        entity: select.giga_hub_live_speed_source
        name: Live graph
        features_position: inline
        features:
          - type: select-options
        grid_options:
          columns: full
      - type: conditional
        conditions:
          - condition: state
            entity: select.giga_hub_live_speed_source
            state: fibre
        grid_options:
          columns: full
        card:
          type: vertical-stack
          cards:
            - type: custom:mini-graph-card
              name: Speed (live, fibre)
              icon: mdi:swap-vertical
              hours_to_show: 3
              points_per_hour: 360
              line_width: 2
              show:
                fill: fade
                legend: true
                extrema: true
              entities:
                - entity: sensor.giga_hub_fibre_download_speed
                  name: Download
                - entity: sensor.giga_hub_fibre_upload_speed
                  name: Upload
            - type: custom:mini-graph-card
              name: Speed (24 h, 5-min peaks)
              hours_to_show: 24
              points_per_hour: 12
              aggregate_func: max
              line_width: 2
              show:
                fill: fade
                legend: false
              entities:
                - entity: sensor.giga_hub_fibre_download_speed
                  name: Download
                - entity: sensor.giga_hub_fibre_upload_speed
                  name: Upload
      - type: conditional
        conditions:
          - condition: state
            entity: select.giga_hub_live_speed_source
            state: internet
        grid_options:
          columns: full
        card:
          type: vertical-stack
          cards:
            - type: custom:mini-graph-card
              name: Speed (live, internet)
              icon: mdi:swap-vertical
              hours_to_show: 3
              points_per_hour: 120
              line_width: 2
              show:
                fill: fade
                legend: true
                extrema: true
              entities:
                - entity: sensor.giga_hub_download_speed
                  name: Download
                - entity: sensor.giga_hub_upload_speed
                  name: Upload
            - type: custom:mini-graph-card
              name: Speed (24 h, 5-min peaks)
              hours_to_show: 24
              points_per_hour: 12
              aggregate_func: max
              line_width: 2
              show:
                fill: fade
                legend: false
              entities:
                - entity: sensor.giga_hub_download_speed
                  name: Download
                - entity: sensor.giga_hub_upload_speed
                  name: Upload

  - type: grid
    cards:
      - type: heading
        heading: Data usage
        heading_style: title
        icon: mdi:chart-bar
      - type: statistics-graph
        title: Daily (last 30 days)
        chart_type: line
        period: day
        days_to_show: 30
        stat_types: [change]
        entities:
          - entity: sensor.giga_hub_data_downloaded
            name: Downloaded
          - entity: sensor.giga_hub_data_uploaded
            name: Uploaded
        grid_options:
          columns: full
      - type: statistics-graph
        title: Monthly
        chart_type: line
        period: month
        days_to_show: 365
        stat_types: [change]
        entities:
          - entity: sensor.giga_hub_data_downloaded
            name: Downloaded
          - entity: sensor.giga_hub_data_uploaded
            name: Uploaded
        grid_options:
          columns: full
      - type: statistic
        entity: sensor.giga_hub_data_downloaded
        name: Downloaded this month
        period:
          calendar:
            period: month
        stat_type: change
      - type: statistic
        entity: sensor.giga_hub_data_uploaded
        name: Uploaded this month
        period:
          calendar:
            period: month
        stat_type: change

  - type: grid
    cards:
      - type: heading
        heading: Speed test
        heading_style: title
        icon: mdi:speedometer
        badges:
          - type: entity
            entity: sensor.giga_hub_speed_test_last_run
            show_state: true
      - type: tile
        entity: sensor.giga_hub_speed_test_download
        name: Download
      - type: tile
        entity: sensor.giga_hub_speed_test_upload
        name: Upload
      - type: tile
        entity: sensor.giga_hub_speed_test_latency
        name: Latency
      - type: tile
        entity: button.giga_hub_run_speed_test
        name: Run speed test
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.giga_hub_run_speed_test
          confirmation:
            text: Run the hub's speed test? It saturates the line for about 30 seconds.
      - type: statistics-graph
        title: Speed test history
        chart_type: line
        period: day
        days_to_show: 90
        stat_types: [max]
        entities:
          - entity: sensor.giga_hub_speed_test_download
            name: Download
          - entity: sensor.giga_hub_speed_test_upload
            name: Upload
        grid_options:
          columns: full

  - type: grid
    cards:
      - type: heading
        heading: Fibre line
        heading_style: title
        icon: mdi:led-on
      - type: tile
        entity: binary_sensor.giga_hub_fibre_problem
        name: Fibre
      - type: tile
        entity: sensor.giga_hub_fibre_errors
        name: Errors
      - type: custom:mini-graph-card
        name: Receive power (7 days)
        icon: mdi:led-on
        hours_to_show: 168
        points_per_hour: 2
        decimals: 2
        line_width: 2
        show:
          extrema: true
          fill: false
        # Healthy XGS-PON receive is roughly -8 to -26 dBm. Below about -24 starts to get marginal.
        color_thresholds:
          - value: -28
            color: "#db4437"
          - value: -24
            color: "#f4b400"
          - value: -20
            color: "#0f9d58"
        entities:
          - sensor.giga_hub_fibre_receive_power
        grid_options:
          columns: full
      - type: tile
        entity: sensor.giga_hub_fibre_transmit_power
        name: Transmit power
      - type: tile
        entity: sensor.giga_hub_fibre_module_temperature
        name: Module temperature

  - type: grid
    # Two columns wide so the device tables have room.
    column_span: 2
    cards:
      - type: heading
        heading: Wi-Fi
        heading_style: title
        icon: mdi:wifi
        badges:
          - type: entity
            entity: sensor.giga_hub_2_4_ghz_channel
            name: 2.4 GHz ch
            show_icon: false
            state_content: [name, state, bandwidth]
          - type: entity
            entity: sensor.giga_hub_5_ghz_channel
            name: 5 GHz ch
            show_icon: false
            state_content: [name, state, bandwidth]
          - type: entity
            entity: sensor.giga_hub_6_ghz_channel
            name: 6 GHz ch
            show_icon: false
            state_content: [name, state, bandwidth]
      - type: tile
        entity: sensor.giga_hub_2_4_ghz_clients
        name: 2.4 GHz
      - type: tile
        entity: sensor.giga_hub_5_ghz_clients
        name: 5 GHz
      - type: tile
        entity: sensor.giga_hub_6_ghz_clients
        name: 6 GHz
      - type: tile
        entity: sensor.giga_hub_wi_fi_devices_on_pods
        name: On pods
      - type: custom:mini-graph-card
        name: Wi-Fi traffic to clients (6 h)
        hours_to_show: 6
        points_per_hour: 60
        line_width: 2
        smoothing: true
        show:
          fill: false
          legend: true
        entities:
          - entity: sensor.giga_hub_2_4_ghz_download
            name: 2.4 GHz
          - entity: sensor.giga_hub_5_ghz_download
            name: 5 GHz
          - entity: sensor.giga_hub_6_ghz_download
            name: 6 GHz
        grid_options:
          columns: full
      - type: tile
        entity: sensor.giga_hub_busiest_wi_fi_device
        name: Busiest Wi-Fi device
        grid_options:
          columns: full
      - type: custom:flex-table-card
        title: Wi-Fi devices
        # Click a header to sort; until then it's busiest first (last 5 minutes).
        # Devices on a pod aren't listed: the hub can't see them.
        # `this.raw_data[n]` reads column n of the same row (hidden columns count).
        # Number cells are Number objects with a display toString, so they sort as numbers;
        # pod devices have no radio stats and show "—".
        entities:
          include: sensor.giga_hub_busiest_wi_fi_device
        columns:
          - name: Device
            data: devices.name
          - name: IP
            data: devices.ip
            modify: "x || ''"
          - name: Band
            data: devices.band
            align: center
          - name: Signal
            data: devices.signal_dbm
            align: right
            modify: "x == null ? '—' : Object.assign(new Number(x), {toString: () => x + ' dBm ' + (x >= -60 ? '🟢' : x >= -70 ? '🟡' : '🔴')})"
          - name: Wi-Fi
            data: devices.standard
            align: center
            modify: "({ax: this.raw_data[2] == '6 GHz' ? 'Wi-Fi 6E' : 'Wi-Fi 6', ac: 'Wi-Fi 5', n: 'Wi-Fi 4', g: 'Wi-Fi 3', a: 'Wi-Fi 2', b: 'Wi-Fi 1'})[x] || x || '—'"
          - name: Link ↓ / ↑
            data: devices.link_down_mbps
            align: right
            modify: "x == null ? '—' : Object.assign(new Number(x), {toString: () => x + ' / ' + this.raw_data[7] + ' Mbps'})"
          - name: Since connecting ↓ / ↑
            data: devices.downloaded_gb
            align: right
            modify: "x == null ? '—' : Object.assign(new Number(x), {toString: () => x.toFixed(1) + ' / ' + (this.raw_data[8] ?? 0).toFixed(2) + ' GB'})"
          - data: devices.link_up_mbps
            hidden: true
          - data: devices.uploaded_gb
            hidden: true
        css:
          table+: "padding-top: 0;"
        grid_options:
          columns: full

  - type: grid
    cards:
      - type: heading
        heading: Devices
        heading_style: title
        icon: mdi:devices
      - type: tile
        entity: sensor.giga_hub_devices_connected
        name: Connected
      - type: tile
        entity: sensor.giga_hub_wired_devices
        name: Wired
      - type: custom:mini-graph-card
        name: Devices online (7 days)
        hours_to_show: 168
        points_per_hour: 1
        line_width: 2
        show:
          fill: fade
          legend: true
        entities:
          - entity: sensor.giga_hub_wi_fi_devices
            name: Wi-Fi
          - entity: sensor.giga_hub_wired_devices
            name: Wired
        grid_options:
          columns: full
      - type: markdown
        title: Wired devices
        content: >-
          {%- set rows = state_attr('sensor.giga_hub_wired_devices', 'details') or [] -%}
          {%- if rows -%}
          <table width="100%">
          <tr><th align="left">Device</th><th align="left">IP</th><th align="right">Link</th></tr>
          {%- for r in rows -%}
          {%- set l = r.link_mbps -%}
          <tr>
          <td>{{ r.name }}</td>
          <td>{{ r.ip or '' }}</td>
          <td align="right">{{ '' if l is none else (('%g Gbps' % (l / 1000)) if l >= 1000 else (l ~ ' Mbps')) }}</td>
          </tr>
          {%- endfor -%}
          </table>
          {%- else -%}
          <p>No wired devices right now.</p>
          {%- endif -%}
        grid_options:
          columns: full
      - type: markdown
        title: TV receivers
        # Hidden for anyone without Bell TV boxes.
        visibility:
          - condition: numeric_state
            entity: sensor.giga_hub_tv_receivers
            above: 0
        content: >-
          {%- set rows = state_attr('sensor.giga_hub_tv_receivers', 'details') or [] -%}
          {%- if rows -%}
          <table width="100%">
          <tr><th align="left">Receiver</th><th>Connection</th><th align="right">Signal</th><th align="right">Link ↓ / ↑</th><th align="right">Since connecting ↓ / ↑</th></tr>
          {%- for r in rows -%}
          {%- set s = r.signal_dbm -%}
          <tr>
          <td>{{ r.name }}</td>
          <td align="center">{{ r.band if r.connection == 'Wi-Fi' else ('LAN port ' ~ r.port if r.port else 'Wired') }}</td>
          <td align="right">{% if s is not none %}{{ s }} dBm {{ '🟢' if s >= -60 else ('🟡' if s >= -70 else '🔴') }}{% endif %}</td>
          <td align="right">{% if r.link_down_mbps is not none %}{{ r.link_down_mbps }} / {{ r.link_up_mbps }} Mbps{% endif %}</td>
          <td align="right">{% if r.downloaded_gb is not none %}{{ '%.1f' % r.downloaded_gb }} / {{ '%.2f' % r.uploaded_gb }} GB{% endif %}</td>
          </tr>
          {%- endfor -%}
          </table>
          <p><sub>Wireless receivers use the hub's hidden TV network, so they have no address on your home network.</sub></p>
          {%- endif -%}
        grid_options:
          columns: full
      - type: markdown
        title: New devices
        content: >-
          {%- set recent = state_attr('sensor.giga_hub_newest_device', 'recent') or [] -%}
          {%- if recent -%}
          <table width="100%">
          <tr><th align="left">When</th><th align="left">Device</th><th align="left">Maker</th><th>Via</th></tr>
          {%- for d in recent[:10] -%}
          <tr><td>{{ as_timestamp(d.time) | timestamp_custom('%b %-d, %-I:%M %p') }}</td><td>{{ d.name }}</td><td>{{ d.vendor or '' }}</td><td align="center">{{ d.connection or '' }}</td></tr>
          {%- endfor -%}
          </table>
          {%- else -%}
          <p>No new devices yet. Anything the hub has never seen before will show up here.</p>
          {%- endif -%}
        grid_options:
          columns: full

  - type: grid
    cards:
      - type: heading
        heading: Hub
        heading_style: title
        icon: mdi:router-wireless
      - type: tile
        entity: sensor.giga_hub_last_boot
        name: Last boot
      - type: tile
        entity: sensor.giga_hub_memory_used
        name: Memory
      - type: tile
        entity: sensor.giga_hub_lan_port_1_link_speed
        name: LAN port 1
      - type: tile
        entity: sensor.giga_hub_lan_port_2_link_speed
        name: LAN port 2
      - type: tile
        entity: button.giga_hub_restart
        name: Restart hub
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.giga_hub_restart
          confirmation:
            text: Restart the Giga Hub? Internet and Wi-Fi drop for a few minutes.
