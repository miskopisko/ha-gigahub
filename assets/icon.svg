<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0e5a72"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="fibre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- stat bars, rising -->
  <g fill="#ffffff">
    <rect x="262" y="268" width="50" height="124" rx="14" opacity="0.55"/>
    <rect x="330" y="206" width="50" height="186" rx="14" opacity="0.75"/>
    <rect x="398" y="128" width="50" height="264" rx="14" opacity="0.95"/>
  </g>

  <!-- the hub: a slim tower -->
  <rect x="96" y="96" width="120" height="296" rx="40" fill="url(#hub)"/>
  <rect x="140" y="138" width="32" height="8" rx="4" fill="#0e5a72" opacity="0.35"/>
  <circle cx="156" cy="330" r="14" fill="#fbbf24"/>

  <!-- fibre light: leaves the hub's base and runs out along the bottom -->
  <path d="M156 392 C 156 432, 196 440, 256 440 L 448 440" fill="none"
        stroke="#fde68a" stroke-width="26" stroke-linecap="round" filter="url(#glow)" opacity="0.35"/>
  <path d="M156 392 C 156 432, 196 440, 256 440 L 448 440" fill="none"
        stroke="url(#fibre)" stroke-width="12" stroke-linecap="round"/>
</svg>
